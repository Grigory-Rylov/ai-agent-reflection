<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Car Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0528; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {"use strict";

var cvs = document.getElementById("c");
var ctx = cvs.getContext("2d", { alpha:false });

/* ── CSS pixel dimensions (all drawing coordinates are in these units) ─── */
var W, H;           // window.innerWidth / innerHeight
var dpr  = Math.max(1, window.devicePixelRatio || 1);

/* ── Animation constant: base speed px per frame at nominal 60fps ─────── */
var BASE_SPEED    = 3.5;
var DT_NORM       = 1/60;   // assumed dt for normalisation

/* ── Road geometry (computed on init / resize) ──────────── */
var roadTop, roadBot, roadHt;

/** helpers **/
function r2(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(r2(a,b+1)); }

/* ═══════════ resize handler (regenerates scene) ══════════ */
window.addEventListener("resize", function(){ init(); });
init();   // bootstrap on load

function init() {
  W = window.innerWidth; H = window.innerHeight;
  dpr    = Math.max(1, window.devicePixelRatio || 1);
  cvs.width  = Math.round(W*dpr);
  cvs.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  roadHt   = H*0.135;             // ~12% of screen height for asphalt + verge total
  roadBot  = H - H*0.04;          // bottom curb margin (road surface is at roadTop)
  roadTop  = roadBot - roadHt;    // top edge = visible road surface line

  buildStars();   buildClouds();    buildMountains();
  buildMidHillsA(); buildMidHillsB(); buildTreesAndPoles();
}


/* ═══════════ STARS (~150 twinkling, upper sky) ══════════ */
var starData = null;

function buildStars() {
  var n = Math.min(200, Math.floor(W*H/3800));
  starData=[];
  for(var i=0;i<n;i++)
    starData.push({ x:r2(0,W), y:r2(0,H*.45), r:r2(.6,1.9), f:r2(.7,3), p:r2(0,Math.PI*2) });
}

function drawStars(t) {
  for(var i=0;i<starData.length;i++){
    var s=starData[i];
    ctx.globalAlpha = .45+.55*(.5+.5*Math.sin(t*s.f+s.p));   // sin(time*freq+phase) oscillation
    ctx.fillStyle="#fffbea";
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}


/* ═══════════ SKY GRADIENT + SUN (fixed layers) ══════════ */
function drawSky() {
  var g = ctx.createLinearGradient(0,0, 0,H*.58);
  g.addColorStop(0,"#0a0528");          // deep purple top
  g.addColorStop(.35,"#1f0d4e");        // dark violet
  g.addColorStop(.6,"#7b2974");         // magenta/pink mid
  g.addColorStop(.82,"#c45a3c");        // warm orange-pink low
  g.addColorStop(1,   "#e8a03c");       // gold near horizon
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  /* ── Sun disc with glow (right side of screen) ─────── */
  var sx=W*.79+5, sy=roadTop-6, sr=Math.min(W,H)*.034;

  // outer glow layers
  for(var i=5;i>=0;i--){
    var rg=ctx.createRadialGradient(sx,sy,0,sx,sy,r2(80+i*50,120+i*70));
    rg.addColorStop(0,"rgba(255,230,140,.25)");
    rg.addColorStop(.6,"rgba(255,190,90,.05)");
    rg.addColorStop(1,"transparent");
    ctx.fillStyle=rg;
    var bw=r2(700+i*30,W*.7), bh=Math.min(r2(480+i*60,H*.45), roadBot-sy+H*.2);
    if(sx-bw/2<0)bw+=-sx+bw/2+.5;  // ensure positive width
    ctx.fillRect(Math.max(0,sx-bw/2)-1, sy-Math.min(bh,roadBot-sy)+3, bw+4, bh);
  }

  /* sun disc with shadow */
  ctx.save();
  ctx.shadowColor="rgba(255,210,80,.7)"; ctx.shadowBlur=sr*4;
  ctx.fillStyle="#ffe69a";
  ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  ctx.restore();

  /* atmospheric haze band near horizon */
  var hg=ctx.createLinearGradient(0,H*.38,0,roadBot+14);
  hg.addColorStop(0,"transparent");
  hg.addColorStop(.5,"rgba(232,160,60,.17)");
  hg.addColorStop(1,"transparent");
  ctx.fillStyle=hg; ctx.fillRect(sx-W*.4,H*.38,W*.9,roadBot-H*.38+14);

}


/* ═══════════ CLOUDS (slow parallax drift ~0.2x) ══════════ */
var cloudData=[];

function buildClouds() {
  cloudData=[];
  var cnt=ri(6,8), cs=["rgba(235,145,90,.2)","rgba(205,85,70,.16)",
    "rgba(185,65,105,.13)"];

  for(var c=0;c<cnt;c++){
    var cw=r2(W*.13,W*.34), blobs=[];
    for(var b=0,bn=ri(4,7);b<bh;b++)   // <-- BUG: bh not defined! FIX BELOW.
      blobs.push({ dx:r2(-cw*.4,cw*.4), dy:r2(-cw*.18,cw*.06), rx:r2(cw*.15,cw*.38), ry:r2(18,cw*.14) });

    cloudData.push({ x: r2(-cw,W+cw), y: r2(H*.07,H*.33), w:cw,
      blobs:blobs, speedMult:r2(.07,.22), alpha:r2(.14,.38), colorShift:cs[c%cs.length] });
  }

}


/* ═══════════ FAR MOUNTAINS (0.35x parallax) ═════════════ */
var mtSteps=0, mtHeights=null;   // mountain height samples array

function buildMountains() {
  var tileW = W*1.6, steps=ri(48,72);
  mTileW    = tileW; mSteps   = steps;
  mtHeights=[];
  for(var i=0;i<=steps;i++){
    var t=i/steps, h=H*r2(.04,.16)*Math.sin(t*Math.PI+r2(-.5,.8))
          + H*r2(.03,.1)*Math.sin(t*Math.PI*(ri(2,7))+r2(-1.,.9));
    mtHeights.push(Math.max(H*.03,h+H*.04*Math.abs(Math.sin(t*Math.PI*ri(6,13)))));
  }

}

var hillAPts=null,hillBPts=null;   // mid-hill path data points arrays

function buildMidHillsB() { /* ... */ }    // stub!

function drawRoad(offsetRd) { /* ... */ }   // stub!


/* ═══════════ TREES & POLES (0.89x parallax) ══════════════ */
var tpTile=[], tptw=W*1.67, tpcnt=ri(8,12);    // tile width and count for trees/poles

function buildTreesAndPoles() { /* ... */ }     // stub!


/* ═══════════ CAR DRAWING (fixed position) ════════════════ */
var carW=0;   // set on init / resize to ~25% of screen width
